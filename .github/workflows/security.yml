# Security checks for the repo that holds the subscriber list code.
#
# The addresses themselves never live in git — they are in Netlify Blobs — so
# what this protects is everything that can reach them: a leaked key, a
# vulnerable dependency, or a code change that opens the list up. All of these
# tools are open source and free for public repositories.
#
# Nothing here can publish or deploy. Deploys come from Netlify on push to main.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly disclosed vulnerability in a pinned dependency is
    # found even in a quiet week.
    - cron: '0 13 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole history, not just the new commit
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=package-lock.json

  code:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The same gate the deploy runs, including the list's consent,
      # unsubscribe and admin-auth tests.
      - run: node eval/local-check.js
